[package]
name = "pdfcraft-platform"
description = "Operating-system services shared by the MIXEL Print desktop app and automation tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
mac-app-store = ["dep:apple-scoped-bookmarks", "dep:objc2-foundation"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the dependency graph through the accessibility integration. The portal watcher
# uses the async API so dropping it can cancel an idle subscription without polling.
zbus = { version = "=6.0.0", default-features = false, features = ["default-rt"] }
async-channel = "2"
futures-lite = "2"

[dev-dependencies]
# Exercise the actual portal wire decoder and cancellable worker on every native test host.
zbus = { version = "=6.0.0", default-features = false, features = ["default-rt", "service"] }
async-channel = "2"
futures-lite = "2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-scoped-bookmarks = { version = "=0.1.0", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSPathUtilities", "NSString", "NSBundle", "NSFileManager", "NSURL", "NSError", "NSDictionary"], optional = true }
